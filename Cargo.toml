[package]
name = "steam-overlay-imgui-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
winapi = { version = "=0.3.9", features = [
    "d3d12",
    "dxgi1_4",
    "libloaderapi",
    "synchapi",
    "winuser",
    "processenv",
    "winbase",
    "sysinfoapi",
    "winerror",
    "winnt",
    "processthreadsapi",
    "handleapi",
    "psapi",
] }

[build-dependencies]
cc = "=1.2.60"
